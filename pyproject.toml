[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "acoustic-lens-ray-simulator"
version = "0.1.0"
description = "A ray tracing simulator for acoustic lens analysis."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Thiago E. Kalid", email = "thiagokkalid@gmail.com" },
]
dependencies = [
    "numpy",
    "matplotlib",
    "tqdm",
    "mini-auspex",
    "scipy",
    "numba",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

# Standard package discovery for setuptools
[tool.setuptools.packages.find]
where = ["."]
